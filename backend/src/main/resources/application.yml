server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: talentbridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentbridge}
    username: ${DB_USERNAME:talentbridge}
    password: ${DB_PASSWORD:talentbridge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized