server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: talentbridge
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:10MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentbridge}
    username: ${DB_USERNAME:talentbridge}
    password: ${DB_PASSWORD:talentbridge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  analysis:
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-4-5-20250929}
      endpoint: ${CLAUDE_API_ENDPOINT:https://api.anthropic.com/v1/messages}
  storage:
    local-directory: ${UPLOAD_DIRECTORY:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}